name: Mobile Tailoring Contract Tests

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/app/routers/mobile_tailoring.py"
      - "apps/backend/app/routers/resumes.py"
      - "apps/backend/app/services/supabase_backend.py"
      - "apps/backend/app/services/progress.py"
      - "apps/backend/app/services/mobile_progress.py"
      - "apps/backend/app/services/mobile_jobs.py"
      - "apps/backend/app/main.py"
      - "apps/backend/tests/unit/test_mobile_background_jobs.py"
      - "apps/backend/tests/unit/test_mobile_real_progress.py"
      - "apps/backend/tests/unit/test_mobile_keyword_wizard.py"
      - "apps/backend/tests/unit/test_mobile_tailoring_contract.py"
      - "apps/backend/pyproject.toml"
      - ".github/workflows/mobile-tailoring-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - name: Compile mobile Python source
        run: |
          python -m compileall -q apps/backend/app/routers/mobile_tailoring.py apps/backend/app/services/supabase_backend.py apps/backend/app/services/progress.py apps/backend/app/services/mobile_progress.py apps/backend/app/services/mobile_jobs.py apps/backend/tests/unit/test_mobile_real_progress.py apps/backend/tests/unit/test_mobile_background_jobs.py
      - name: Install backend and test dependencies
        run: python -m pip install -e './apps/backend[dev]'
      - name: Run isolated mobile contract regression tests
        working-directory: apps/backend
        run: python -m pytest -q tests/unit/test_mobile_tailoring_contract.py tests/unit/test_mobile_keyword_wizard.py tests/unit/test_mobile_real_progress.py tests/unit/test_mobile_background_jobs.py
